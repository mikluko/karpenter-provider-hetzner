version: "3"

vars:
  BINARY: karpenter-provider-hetzner
  CHART_CRDS: charts/karpenter-provider-hetzner/crds
  CONTROLLER_GEN: go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.23.0
  ENVTEST: go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
  ENVTEST_K8S_VERSION: 1.34.0

tasks:
  build:
    desc: Build the controller binary into ./bin
    cmds:
      - go build -o bin/{{.BINARY}} ./cmd/controller

  test:
    desc: Run unit and controller tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  generate:
    desc: Regenerate deepcopy, the HCloudNodeClass CRD and the vendored core CRDs
    deps: [vendor-core-crds]
    cmds:
      - '{{.CONTROLLER_GEN}} object:headerFile=hack/boilerplate.go.txt paths="./pkg/apis/..."'
      - '{{.CONTROLLER_GEN}} crd paths="./pkg/apis/..." output:crd:dir={{.CHART_CRDS}}'

  # The controller watches NodePool and NodeClaim, so the chart is unusable
  # without them. They come from the pinned sigs.k8s.io/karpenter module, so a
  # version bump that changes their schema fails generate-verify.
  #
  # NodeOverlay and CapacityBuffer are not vendored: both sit behind feature
  # gates that default to false, and the chart does not expose them.
  vendor-core-crds:
    desc: Copy the Karpenter core CRDs out of the pinned sigs.k8s.io/karpenter module
    cmds:
      - go mod download sigs.k8s.io/karpenter
      - |
        set -eu
        dir="$(go list -m -f '{{"{{"}}.Dir{{"}}"}}' sigs.k8s.io/karpenter)"
        [ -n "$dir" ] || { echo "sigs.k8s.io/karpenter not found in module cache" >&2; exit 1; }
        for crd in karpenter.sh_nodepools.yaml karpenter.sh_nodeclaims.yaml; do
          cp "$dir/pkg/apis/crds/$crd" "{{.CHART_CRDS}}/$crd"
          chmod u+w "{{.CHART_CRDS}}/$crd"
        done

  generate-verify:
    desc: Fail when the generated files differ from what is committed
    deps: [generate]
    cmds:
      - |
        if [ -n "$(git status --porcelain pkg/apis {{.CHART_CRDS}})" ]; then
          echo "generated files are out of date; run 'task generate' and commit"
          git --no-pager diff -- pkg/apis {{.CHART_CRDS}}
          exit 1
        fi

  test-envtest:
    desc: Run the controller and API tests against a real API server
    cmds:
      - |
        assets="$({{.ENVTEST}} use {{.ENVTEST_K8S_VERSION}} -p path)"
        [ -n "$assets" ]
        KUBEBUILDER_ASSETS="$assets" go test -race -count=1 ./pkg/controllers/... ./pkg/apis/...
