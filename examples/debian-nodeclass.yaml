# Debian NodeClass + NodePool — joins a k0s cluster with the generated join
#
# Prerequisites:
#   - A running k0s control plane reachable from new nodes, and the provider
#     installed with apiServerURL set to that address.
#   - The control plane's k0s version.  Print it on a controller with:
#       sudo k0s version
#   - The Hetzner private network ID and (optionally) firewall IDs.
#
# Apply with:
#   kubectl apply -f examples/debian-nodeclass.yaml
#
# Notes:
#   - No custom image needed: the provider resolves Hetzner's Debian 13 image
#     for each architecture.
#   - Each node joins with its own bootstrap token, which the provider creates
#     and deletes with the NodeClaim.  See docs/debian-bootstrap.md.

apiVersion: karpenter.hetzner.cloud/v1
kind: HCloudNodeClass
metadata:
  name: debian-default
spec:
  locations:
    - nbg1
    - fsn1

  imageSelector:
    family: debian
    # version pins the Debian release; omit to always get the newest.
    # Debian 13 is trixie.
    version: "13"

  # networkID: numeric Hetzner private network ID.
  # ADJUST: replace with your network ID.
  networkID: 123456

  # firewallIDs: optional.  ADJUST or remove.
  firewallIDs:
    - 987654

  placementGroupStrategy: spread

  labels:
    managed-by: karpenter
    env: production

  # enablePublicIPv4: true keeps a public IP so nodes can download k0s from
  # GitHub.  Set false if you route egress through NAT.
  enablePublicIPv4: true
  enablePublicIPv6: false

  bootstrap:
    # ADJUST: the release tag `sudo k0s version` prints on a controller.
    k0sVersion: v1.34.1+k0s.0

---
# NodePool for Debian nodes — x86-64, shared-CPU (cpx family for cost).

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: debian-amd64
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.hetzner.cloud
        kind: HCloudNodeClass
        name: debian-default

      requirements:
        # Hetzner has no spot capacity. Pin on-demand, or Karpenter core sets spot on
        # every consolidation replacement and the replacement never launches.
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]

        - key: kubernetes.io/arch
          operator: In
          values: [amd64]

        # cpx: shared x86 — good baseline cost/performance for generic workloads.
        # Add cax (ARM) or ccx (dedicated x86) as additional values if desired.
        - key: karpenter.hetzner.cloud/server-family
          operator: In
          values: [cpx]

        - key: topology.kubernetes.io/zone
          operator: In
          values: [nbg1, fsn1]

  limits:
    cpu: "100"
    memory: 400Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
