name: Bug report
description: Report a problem with the provider
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Redact secrets, tokens, and kubeconfigs from everything below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Node class and node pool
      description: The HCloudNodeClass and NodePool involved, and the steps that trigger the problem.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      render: shell
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      description: The chart or image version, for example 0.1.0.
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
    validations:
      required: true
