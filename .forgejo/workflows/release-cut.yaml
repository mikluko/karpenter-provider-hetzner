name: Cut release
run-name: Checking changelog for a due release

on:
  push:
    branches: [main]

concurrency:
  group: release-cut
  cancel-in-progress: false

# A tag pushed with the automatic token triggers no workflow, so a run on main
# trades an OIDC token for mikluko's Authorized Integration
# karpenter-provider-hetzner-cut, selected by CUT_AUDIENCE and scoped
# write:repository on this repository, and pushes the tag with that.
enable-openid-connect: true

env:
  CUT_AUDIENCE: u:1:8cbce119-482b-440a-8026-7c203b01fad7

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yaml

  cut:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changelog
        uses: https://sarak.sh/mikluko/changelog@v1
      - name: Cut
        if: steps.changelog.outputs.due == 'true'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CUT_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          git tag "v$VERSION"
          git -c http.extraHeader="Authorization: Bearer $jwt" push origin "refs/tags/v$VERSION"
