name: CI

# On main, ci runs only as the first job of release-cut.yaml.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/go-task/task/v3/cmd/task@v3.54.0 test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: https://github.com/golangci/golangci-lint-action@v9
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/go-task/task/v3/cmd/task@v3.54.0 generate-verify

  controllers:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      # test-envtest also installs the shipped CRDs on a real API server and checks
      # their admission rules, which plain go test skips without KUBEBUILDER_ASSETS.
      - run: go run github.com/go-task/task/v3/cmd/task@v3.54.0 test-envtest

  # The chart had no CI at all until a release-scoping bug (#73) shipped in it.
  # These renders are cheap and catch the whole class of failure that reaches
  # users as a failed `helm install`: a template that does not parse, a values
  # shape that hard-errors, and a Deployment whose selector does not match the
  # pods it templates.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: helm lint charts/karpenter-provider-hetzner --set clusterName=ci --set apiServerURL=https://10.0.0.2:6443
      - name: Render the documented install
        run: |
          helm template karpenter-provider-hetzner charts/karpenter-provider-hetzner \
            --set clusterName=ci --set apiServerURL=https://10.0.0.2:6443 > /tmp/default.yaml
      - name: Render every optional resource
        run: |
          helm template karpenter-provider-hetzner charts/karpenter-provider-hetzner \
            --set clusterName=ci --set apiServerURL=https://10.0.0.2:6443 --set replicas=2 \
            --set serviceMonitor.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=1 > /dev/null
      - name: The lease name reaches the controller only when set
        run: |
          set -euo pipefail
          if helm template ci charts/karpenter-provider-hetzner --set clusterName=ci --set apiServerURL=https://10.0.0.2:6443 | grep -q LEADER_ELECTION_NAME; then
            echo "LEADER_ELECTION_NAME rendered without leaderElection.name" >&2; exit 1
          fi
          helm template ci charts/karpenter-provider-hetzner --set clusterName=ci --set apiServerURL=https://10.0.0.2:6443 \
            --set leaderElection.name=hetzner-leader-election \
            | grep -A1 'name: LEADER_ELECTION_NAME' | grep -q 'value: "hetzner-leader-election"'
      - name: Two releases in one namespace must not share a selector
        run: |
          set -euo pipefail
          for r in ci-a ci-b; do
            helm template "$r" charts/karpenter-provider-hetzner \
              --namespace shared --set clusterName="$r" --set apiServerURL=https://10.0.0.2:6443 > "/tmp/$r.yaml"
          done
          # Every selector must name its own release. If the instance label were
          # dropped again, both files would carry the same selector block and the
          # two Deployments would fight over each other's pods.
          grep -q 'app.kubernetes.io/instance: ci-a' /tmp/ci-a.yaml
          grep -q 'app.kubernetes.io/instance: ci-b' /tmp/ci-b.yaml
          if grep -q 'app.kubernetes.io/instance: ci-b' /tmp/ci-a.yaml; then
            echo "release ci-a renders ci-b's instance label" >&2; exit 1
          fi
          # Resource names must differ too: Helm refuses to adopt an object owned
          # by another release, so identical names fail before selectors matter.
          if diff <(grep '^  name:' /tmp/ci-a.yaml) <(grep '^  name:' /tmp/ci-b.yaml) > /dev/null; then
            echo "both releases render identical resource names" >&2; exit 1
          fi

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://forge.sarak.sh/actions/changelog@v1
