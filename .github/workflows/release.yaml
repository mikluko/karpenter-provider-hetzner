name: Release

# CHANGELOG.md decides the release: a push to main whose newest entry names a
# version no tag carries publishes that version and cuts its tag. On a pull
# request the changelog is only validated.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag-dependent checks read the repository's tags.
          fetch-depth: 0
      - id: changelog
        uses: mikluko/action-changelog@v1

  release:
    needs: changelog
    if: github.event_name == 'push' && needs.changelog.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless cosign)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          artifact-name: sbom-v${{ env.VERSION }}.spdx.json
          output-file: sbom-v${{ env.VERSION }}.spdx.json
          # The release does not exist yet; the SBOM stays a workflow artifact
          # and an in-registry attestation.
          upload-release-assets: false

      - uses: azure/setup-helm@v5

      - name: Publish Helm chart (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/karpenter-provider-hetzner --version "$VERSION" --app-version "$VERSION"
          helm push "karpenter-provider-hetzner-${VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" | gh release create "v$VERSION" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file -
